channeltype_-1 = Не установленный
channeltype_0-1 = Анонимный
channeltype_2 = Проверка
channeltype_3-4 = Обратная связь
channeltype_5 = Рыночная площадь
channeltype_traceable = (АнонИДы)
channeltype_untraceable = (Не поддающийся отслеживанию)
