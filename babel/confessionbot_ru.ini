[meta]
name = Русский
language = confessionbot_ru
flag = 🇷🇺
contributors = Freemandns, wkidish228_337
inherit = ru

[help]
introduction = - **Используйте {p:confess} в настроенном канале.** *Используйте {p:list}, чтобы просмотреть все настроенные каналы.*;
	- Администраторы могут настроить ({p:setup}) каналы и изменять настройки с помощью {p:controlpanel};
	- Модераторы могут перемешивать ({p:shuffle}) анонимные идентификаторы, проверять сообщения и блокировать ({p:block}) пользователей от отправки сообщений;
	- Используйте {p:help} (команда) для получения справки по конкретной команде.
	
	**У вас все еще есть вопросы?**
	Получите индивидуальную поддержку от разработчика и других пользователей на [сервере поддержки]({serverinv}).
bot_description = {c:main/botname} — самый продвинутый анонимный мессенджер в Discord с инструментами для модераторов, несколькими типами анонимных каналов, поддержкой изображений и многим другим!
	Для начала настройте ({p:setup}) анонимный канал.
about_field1_title = ✨ Анонимность+
about_field1_value = **Наслаждайтесь анонимным общением, не отказываясь от модерации.** Модераторы могут блокировать пользователей по их анонимным идентификаторам или сразу менять местами все анонимные идентификаторы на сервере. Каналы обратной связи также можно использовать для анонимного информирования о нарушениях.
about_field2_title = 🔧 Типы каналов для каждого сервера
about_field2_value = **Для каждого есть свой тип канала!** Анонимные идентификаторы можно показывать или скрывать в каждом канале, можно включить проверку на уровне всего сервера, чтобы все сообщения публиковались только после одобрения, а в каналах обратной связи можно отправлять сообщения, не видя других.
about_field3_title = 🖼 Поддержка изображений
about_field3_value = **Изображения по умолчанию автоматически отправляются вместе с анонимными сообщениями.** Это довольно редкое явление для ботов для отправки анонимных сообщений. При желании администраторы могут отключить эту функцию в {p:controlpanel}.
about_field4_title = 🌍 Поддержка перевода
about_field4_value = **{c:main/botname} говорит на нескольких языках и может быть переведен на другие при поддержке сообщества.** Проверьте {p:language list}, чтобы узнать, какие переводы доступны на данный момент.
about_field5_title = 💵 Еще больше возможностей благодаря премиум
about_field5_value = **Поддержите разработку и получите приятные эстетические бонусы для своего сервера!** Узнайте больше о премиальных бонусах с помощью {p:premium}.

[premium]
feature_1 = Компактный режим
feature_1_desc = **Наслаждайтесь анонимными сообщениями в новом компактном формате!** - При включенном компактном формате анонимных сообщений у каждого участника вашего сервера будет анонимный идентификатор и аватарка, поэтому для сообщений не потребуется столько места. *Включите эту функцию в {p:controlpanel}*.
feature_2 = Персонализируйте {c:main/botname} на своем сервере
feature_2_desc = **Добавьте фирменное сообщение над каждым анонимным сообщением** - Вы можете указать роль или наименование своего сервера. *Включите это в {p:controlpanel}*.

	**Переименуйте /confess** — измените название команды {p:confess}, чтобы тесно интегрировать {c:main/botname} в свой сервер. *Включите эту функцию в {p:controlpanel}*.
feature_custom_desc = **Доступны личные сообщения и пользовательские функции** - Свяжитесь с {c:main/creator} на сервере поддержки [{c:help/serverinv}] по поводу ваших пользовательских требований. *Для этого требуется более дорогостоящий уровень поддержки*.

[confessions]
command_Confession_Reply = Ответить анонимным сообщением
command_Confession_Report = Отчет об анонимном сообщение
command_confess = confess
command_confess_desc = Отправьте анонимное сообщение на этот канал.
command_confess_content_desc = Текст вашего анонимного сообщения, оставьте пустым для редактирования абзацев.
command_confess_image_desc = Необязательное изображение, которое может отображаться под текстом или вместо него.
command_confess_help = {p:{cmd}} [сообщение] [изображение]
	Напишите анонимное сообщение для отправки в этом канале. Работает, только если канал настроен. {p:confess} без дополнительных параметров откроет редактор абзацев.
	Поддерживаются только изображения. Видео (и любые другие файлы) не отправляются.
command_confess-to = confess-to
command_confess-to_desc = Отправьте анонимное сообщение в определенный канал.
command_confess-to_channel_desc = Канал, на который вы хотите отправить сообщение. В том числе каналы, которые вы не видите.
command_confess-to_help = {p:{cmd}} (канал) [сообщение] [изображение]
	Напишите анонимное сообщение для отправки в любой канал на этом сервере. Автозаполнение предложит список всех доступных каналов.
	О том, как написать анонимное сообщение, читайте в разделе "{p:help} confess".
command_setup = setup
command_setup_desc = Управление анонимными каналами и их настройками
command_setup_help = {p:{cmd}}
	Открывает интерактивную панель, на которой вы можете настроить каналы confessions и изменить настройки для каждого канала.
command_list = list
command_list_desc = Перечислить все анонимные каналы, доступные здесь.
command_list_help = {p:{cmd}}
	Список всех доступных на данный момент анонимных каналов на этом сервере.
command_block = block
command_block_desc = Блокируйте или разблокируйте любой указанный анонимный идентификатор на этом сервере.
command_block_anonid_desc = Идентификатор Anon-ID рядом с отслеживаемым анонимным сообщением
command_block_unblock_desc = Разблокирует Anon-ID, если для этого параметра установлено значение true
command_block_help = {p:{cmd}} (anon-id) [unblock]
	Запретите любому пользователю с анонимным идентификатором отправлять анонимные сообщения. Запрет будет действовать до тех пор, пока вы не поменяете идентификаторы.
	Чтобы разблокировать, установите для параметра unblock значение true. Например. {p:block} anonid=abc123 unblock=true
command_shuffle = shuffle
command_shuffle_desc = Для защиты анонимности все анонимные идентификаторы на этом сервере будут перемешаны случайным образом
command_shuffle_help = {p:{cmd}}
	Обнуляет все анонимные идентификаторы, чтобы снизить вероятность отслеживания и идентификации одного пользователя.
command_sell = sell
command_sell_desc = Укажите товар, который вы хотите продать анонимно
command_sell_title_desc = Опишите, что вы продаете, в нескольких словах
command_sell_starting_price_desc = Целевая цена, которую вы, скорее всего, согласитесь принять, указана в валюте
command_sell_payment_methods_desc = Укажите способы оплаты, которые вы принимаете. Например, PayPal, Venmo, криптовалюта
command_sell_description_desc = Подробно опишите, что вы продаете, и используйте /confess, чтобы добавить информацию позже
command_sell_image_desc = Изображение товара, если применимо
command_sell_help = {p:{cmd}} (title) (starting_price) (payment_methods) [description] [image]
	Создайте объявление о продаже товара. Объявления можно размещать только на каналах maretplace — используйте {p:list}, чтобы найти подходящий.
	Объявления анонимны, но после того, как вы примете ценовое предложение от покупателя, вы обменяетесь именами пользователей.
	Заголовок должен быть коротким.
	Начальная цена должна быть указана в валюте, например в долларах США, канадских долларах, евро или иенах.
	Способы оплаты могут быть любыми: банковские переводы, криптовалюта или платформа вроде Paypal.
