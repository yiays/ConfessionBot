dm_notifications = Отключить уведомления от ЛС
guild_banlist = Запрещенные идентификаторы анонимов
image_support = Поддержка изображений
enable_webhooks = Компактные анонимные сообщения
confession_preface = Маркировка анонимных сообщений
confess_custom_name = Пользовательская команда /confess
; errors
inaccessible = У вас нет доступа к анонимным каналам.
    *Для запуска администратору необходимо {p:setup} канал.*
inaccessiblelocal = На этом сервере нет анонимных каналов.
    *Для запуска администратору необходимо {p:setup} канал.*
invalidanonid = Указанный вами анонимный идентификатор недействителен!
doublebananonid = Этот анонимный аккаунт уже был забанен!
nomatchanonid = Я не смог найти этот анонимный идентификатор.
missingperms = Отправить анонимное сообщение не удалось, так как мне требуется разрешение {perm} в целевом канале.
embederr = Не удалось отправить сообщение! Скорее всего, у меня нет разрешения на отправку встроенных сообщений.
missingchannelerr = Не удается отправить сообщения в этот канал. Возможно, он больше не существует или я потерял к нему доступ.
timeouterror = Срок действия этого ввода истек.
singlechannel = Эту настройку можно задать только для одного канала на сервере.
no_change = Режим тот же, так что ничего не изменилось.
nospam = Это сообщение было автоматически заблокировано как спам.
vettingrequiredmissing = Не удалось отправить одобренное сообщение. Вероятно, у меня нет прав `VIEW_CHANNEL` для целевого канала.
dmconfessiondisabled = Из соображений производительности функция «Анониманые сообщения в личных сообщениях» и {p:list} в личных сообщениях были отключены. Вместо них используйте {p:confess}, {p:confess-to} и {p:list} на предпочитаемом вами сервере.
	https://media.discordapp.net/attachments/808905578947674112/973161489487781908/GIF.gif
no_moderation = В этом боте отключены функции модерации, поэтому сейчас это невозможно.
; warnings
cachebuilding = {c:main/botname} все еще запускается, поэтому списки каналов в личных сообщениях могут быть неполными.
	> *{p:confess}, {p:confess-to} и {p:list} работают без задержек на серверах.*
vetting = **На некоторых из этих каналов включена функция проверки.** Модератору сервера может потребоваться подтвердить или отклонить ваше анонимное сообщение, прежде чем оно будет опубликовано. При этом вы сохраните анонимность на протяжении всего процесса.
concat_list = Этот список неполный, используйте /list, чтобы увидеть все
; confessions
channelprompt = Выберите канал назначения для анонимного сообщения.
channelprompt_pager = Страница {page}
channelprompt_placeholder = Целевой канал
channelprompted = Ваше анонимное сообщение будет отправлено в {channel}.
	{vetting?*Здесь включена проверка. Ваше сообщение должно быть одобрено модераторами, прежде чем оно станет общедоступным.*|}
channelprompt_button_send = Отправить сообщение
channelprompt_button_sent = Отправленное сообщение
channelprompt_button_prev = Предыдущая страница
channelprompt_button_next = Следующая страница
editor_title = Редактор анонимных сообщений
editor_message_label = Сообщение:
editor_message_placeholder = Текст, который станет вашим анонимным сообщением
confession_reply_failed = Невозможно ответить на сообщения такого типа. Попробуйте ответить на другое сообщение.
confession_sent_channel = Готово, ваше сообщение отправлено в {channel}.
confession_sent_below = Готово, ваше сообщение ниже.
confession_vetting = Ваше сообщение будет проверено и, если его одобрят, появится в {channel}.
confession_vetting_denied = Ваше сообщение не прошло проверку.
confession_vetting_accepted = Ваше сообщение принято и опубликовано в {channel}.
nosendchannel = Здесь нельзя отправлять анонимные сообщения! Используйте эту команду в канале из {p:list}.
nosendbanned = Ничего не выйдет, вас забанили на этом сервере.
nosendimages = Ничего не выйдет, на этом сервере отключены анонимные изображения.
invalidimage = Похоже, это не настоящий файл с изображением.
wrongcommand = Вы должны использовать команду {p:{cmd}} в {channel}.
reply_to = Ответ на {reference};
; setup
setup_start = Ниже представлена текущая конфигурация этого канала. Отсюда вы можете настроить любой канал.
	*Нажмите на кнопку «Справка» ниже, чтобы узнать больше о том, как работает этот канал.*
setup_placeholder = Целевой канал
setup_state = Канал {channel} в настоящее время находится в состоянии `{state}`.
setup_state_missing = Не удалось получить доступ к этому каналу.
state_desc_-1 = > **Неподписанные каналы** не будут принимать анонимные сообщения. Однако вы по-прежнему можете использовать другие команды бота.
state_desc_0 = > **Анонимные (не отслеживаемые) каналы** скрывают анонимные идентификаторы для обеспечения дополнительной анонимности, однако, если установлен канал проверки, анонимные идентификаторы все равно будут отображаться в нем.
state_desc_1 = > **Анонимные каналы (Anon-IDs)** используются по умолчанию. Рядом с сообщениями отображаются Anon-IDs (случайные коды на основе вашего идентификатора пользователя). По ним нельзя найти пользователей, но у каждого пользователя свой цвет и идентификатор.
state_desc_2 = > **Канал проверки** перехватывает анонимные сообщения до того, как они становятся общедоступными. Модераторы могут одобрять или отклонять анонимное сообщение. Отзывы не проверяются.
state_desc_3 = > **Каналы обратной связи (анонимные идентификаторы)** доступны всем пользователям вашего сервера, даже если они не видят сам канал. Пользователям нужно просто использовать {p:confess-to} вместо других способов.
state_desc_4 = > **Каналы обратной связи (не отслеживаемые) ** могут использоваться всеми участниками сервера без необходимости их просмотра, а также не содержат идентификаторов анонимных пользователей. Для использования этого канала пользователям может потребоваться использовать {p:confess-to}.
state_desc_5 = > **Каналы маркетплейса** работают по тому же принципу, что и анонимные каналы (AnonIDs), но анонимные сообщения предназначены для использования в качестве объявлений на маркетплейсе. Пользователи могут делать предложения и договариваться о цене, после чего их имена становятся известны.
state_cta = *Чтобы изменить это поведение, выберите новый тип канала ниже.*
setup_controlpanel = Используйте /controlpanel для настройки всего сервера
setup_help = Помощь
setup_anonids = AnonIDs: {anonids?Показанный|Скрытый}
setsuccess0 = Теперь в этом канале будут публиковаться анонимные сообщения без указания личных данных!
setsuccess1 = Теперь в этом канале будут анонимные сообщения с идентификаторами!
setsuccess2 = Этот канал теперь будет использоваться для проверки сообщений.
	*Убедитесь, что доступ к этому каналу есть только у модераторов!*
setsuccess3 = Теперь в этом канале будет публиковаться анонимная обратная связь с идентификаторами!
	*Убедитесь, что доступ к этому каналу есть только у модераторов!*
setsuccess4 = Теперь в этом канале будет публиковаться анонимная обратная связь без указания личных данных!
	*Убедитесь, что доступ к этому каналу есть только у модераторов!*
setsuccess5 = Теперь этот канал будет функционировать как анонимная торговая площадка.
setcta = Чтобы начать, используйте {p:{cmd1}} в этом канале!{cmd2? (*Если вы не можете печатать здесь, используйте {p:{cmd2}} в другом канале.*)|}
setundo = Чтобы отменить это действие, установите для типа канала значение `Unset` в {p:setup}.
; unsetting
unsetsuccess0 = Этот канал больше не будет принимать анонимные сообщения!
unsetsuccess1 = Этот канал больше не будет принимать анонимные сообщения!
unsetsuccess2 = Этот канал больше не будет использоваться для проверки сообщений.
unsetsuccess3 = Этот канал больше не будет использоваться для анонимной обратной связи.
unsetsuccess4 = Этот канал больше не будет использоваться для анонимной обратной связи.
unsetsuccess5 = На этом канале больше не будет анонимной торговой площадки.
unsetundo = Но убедитесь, что хотя бы один канал настроен!
unsetfailure = Этот канал не установлен, поэтому его нельзя отменить.
; list
listtitle = Вы можете отправлять анонимные сообщения на эти каналы:
listtitlelocal = На этом сервере вы можете отправлять анонимные сообщения в следующие каналы:
confess_to_feedback = **Если вы не видите канал «Обратная связь» (📢):** отправьте анонимное сообщение через {p:confess-to}.
; report
report_prep = ## Отчет {msgurl}
	**Пожалуйста, прочтите [{c:main/botname} Условия использования]({c:main/tos_url}) перед продолжением!**
	Еще кое-что, что вам следует знать;
	- Сообщения отправляются непосредственно разработчикам бота. Если они сочтут, что это сообщение нарушает правила, они могут заблокировать пользователя в этом боте.
	- Если будет установлено, что сервер в целом нарушает Условия использования этого бота, весь сервер может быть заблокирован для использования этого бота.
	- If this is a minor transgression, you should talk to moderators and admins on this server.
	Если вы считаете, что в этом сообщении есть что-то, нарушающее {c:main/botname} Условия предоставления услуг, нажмите кнопку ниже, чтобы продолжить.
report_button = Продолжать сообщать
report_title = Сообщить об анонимном сообщение
report_field = Причина сообщения
report_placeholder = Обоснование вашего мнения о том, что это противоречит Условиям использования {c:main/botname}
report_invalid_message = Сообщение, о котором вы хотите сообщить, не похожее на анонимное сообщение!
report_failed = К сожалению, отправить ваш отчет не удалось! Пожалуйста, сделайте скриншоты и отправьте их {c:help/serverinv} или в личные сообщения {c:main/creator} (владельцу бота).
report_success = Ваш отчет успешно отправлен! Чтобы узнать статус вашего отчета, [подпишитесь на сервер поддержки]({c:help/serverinv}).
new_report = {server} получил следующее анонимное сообщение от {user} по следующей причине:
	> {reason}
; ban
bansuccess = Анонимус-{user} заблокирован.
