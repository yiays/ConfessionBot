; setup
setup_start = Unten siehst du die aktuelle Konfiguration dieses Kanals. Du kannst von hier aus alle Kanäle konfigurieren.
	*Drücke unten auf Hilfe für weitere Informationen darüber, wie dieser Kanal funktioniert.*
