report_failed = Deine Meldung konnte nicht gesendet werden! Bitte mache Screenshots und sende sie an {c:help/serverinv} oder per DM an {c:main/creator} (den Bot-Besitzer).
report_success = Deine Meldung wurde erfolgreich gesendet! Um den Status deiner Meldung zu erfahren, [tritt dem Support-Server bei]({c:help/serverinv}).
