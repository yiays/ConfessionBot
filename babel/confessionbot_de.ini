[meta]
name = German (Germany)
language = confessionbot_de
flag = 🇩🇪
contributors = 3n3scan, Gemini, Yiays
inherit = de

[help]
introduction = - **Verwende {p:confess} in einem Kanal, der eingerichtet wurde.** *Verwende {p:list}, um alle eingerichteten Kanäle zu sehen.*
	- Admins können Kanäle {p:setup} einrichten und Einstellungen mit {p:controlpanel} anpassen.
	- Mods können Anon-IDs {p:shuffle}, Nachrichten überprüfen und Benutzer vom Senden von Nachrichten {p:block}ieren.
	- Verwende {p:help} `(befehl)` für Hilfe zu einem bestimmten Befehl.
	
	{serverinv?**Hast du noch Fragen?**|}
	{serverinv?Erhalte engagierten Support vom Entwickler und anderen Benutzern auf dem [Support-Server]({serverinv}).|}
bot_description = {c:main/botname} ist der fortschrittlichste anonyme Messaging-Bot auf Discord, mit Mod-Tools, mehreren anonymen Kanaltypen, Bildunterstützung und vielem mehr!
	Richte zu Beginn einen anonymen Kanal mit {p:setup} ein.
about_field1_title = ✨ Anonymität plus
about_field1_value = **Genieße anonyme Unterhaltungen, ohne auf Moderation zu verzichten.** Moderatoren können Benutzer anhand ihrer Anon-ID blockieren oder alle Anon-IDs auf dem Server auf einmal mischen. Feedback-Kanäle können auch für anonymes Whistleblowing genutzt werden.
about_field2_title = 🔧 Kanaltypen für jeden Server
about_field2_value = **Es gibt einen Kanaltyp für jeden!** Anon-IDs können pro Kanal ein- oder ausgeblendet werden, die Überprüfung kann serverweit aktiviert werden, sodass alle Nachrichten vor der Veröffentlichung genehmigt werden müssen, und Feedback-Kanäle können genutzt werden, ohne andere Nachrichten zu sehen.
about_field3_title = 🖼 Bildunterstützung
about_field3_value = **Bilder werden auf Wunsch standardmäßig automatisch mit Geständnissen mitgesendet.** Dies ist bei Geständnis-Bots überraschend selten. Admins können dies in {p:controlpanel} deaktivieren, wenn sie möchten.
about_field4_title = 🌍 Übersetzungsunterstützung
about_field4_value = **{c:main/botname} spricht mehrere Sprachen und kann mit Unterstützung der Community in weitere übersetzt werden.** Überprüfe {p:language list}, um aktuell verfügbare Übersetzungen zu sehen.
about_field5_title = 💵 Noch mehr Funktionen mit Premium
about_field5_value = **Unterstütze die Entwicklung und erhalte einige nette ästhetische Vorteile für deinen Server!** Erfahre mehr über Premium-Vorteile mit {p:premium}.

[premium]
feature_1 = Kompaktmodus
feature_1_desc = **Genieße Geständnisse in einem neuen kompakten Stil!** - Wenn kompakte Geständnisse aktiviert sind, erhält jedes Mitglied auf deinem Server einen Anon-ID-Benutzer und ein Profilbild, sodass Nachrichten nicht so viel Platz benötigen. *Aktiviere dies in {p:controlpanel}*.
feature_2 = Mache {c:main/botname} zu deinem Server-Bot
feature_2_desc = **Füge eine Branding-Nachricht über jedem Geständnis hinzu** - Du könntest eine Rolle erwähnen oder deinen Server benennen. *Aktiviere dies in {p:controlpanel}*.

	**Benenne /confess um** - Ändere den Namen des Befehls {p:confess}, um {c:main/botname} eng in deinen Server zu integrieren. *Aktiviere dies in {p:controlpanel}*.
feature_custom_desc = **DM-Geständnisse und benutzerdefinierte Funktionen verfügbar** - Setze dich mit {c:main/creator} auf dem [Support-Server]({c:help/serverinv}) bezüglich deiner maßgeschneiderten Anforderungen in Verbindung. *Dies erfordert eine teurere Support-Stufe*.

[confessions]
command_Confession_Reply = Anonyme Antwort
command_Confession_Report = Anonyme Nachricht melden
command_confess = beichten
command_anon = anon
command_confess_desc = Sende eine anonyme Nachricht in diesen Kanal.
command_confess_content_desc = Der Text deiner anonymen Nachricht. Leer lassen für einen Absatzeditor.
command_confess_image_desc = Ein optionales Bild, das unter oder anstelle des Textes erscheinen kann.
command_confess_help = {p:{cmd}} [message] [image]
	Schreibe eine anonyme Nachricht, um sie in diesem Kanal zu senden. Funktioniert nur, wenn der Kanal eingerichtet ist. {p:confess} ohne festgelegte Optionen öffnet einen Absatzeditor.
	Nur Bilder werden unterstützt. Videos (und alle anderen Dateien) werden nicht gesendet.
command_confess-to = beichten-an
command_anon-to = anon-an
command_confess-to_desc = Sende eine anonyme Nachricht an einen bestimmten Kanal.
command_confess-to_channel_desc = Der Kanal, an den du senden möchtest. Einschließlich Kanälen, die du nicht sehen kannst.
command_confess-to_help = {p:{cmd}} (channel) [message] [image]
	Schreibe eine anonyme Nachricht, die du in einem beliebigen Kanal auf diesem Server senden kannst. Die automatische Vervollständigung listet alle Kanäle auf, die du verwenden kannst.
	Siehe {p:help} beichten, wie man ein Geständnis schreibt.
command_setup = setup
command_setup_desc = Verwalte anonyme Kanäle und deren Einstellungen.
command_setup_help = {p:{cmd}}
	Öffnet ein interaktives Panel, in dem du Geständnis-Kanäle einrichten und Einstellungen für jeden Kanal ändern kannst.
command_list = liste
command_list_desc = Liste alle hier verfügbaren anonymen Kanäle auf.
command_list_help = {p:{cmd}}
	Listet alle derzeit verfügbaren anonymen Kanäle auf diesem Server auf.
command_block = blockieren
command_block_desc = Blockiere oder entblocke eine bestimmte Anon-ID vom Beichten auf diesem Server.
command_block_anonid_desc = Die Anon-ID, die neben einer nachverfolgbaren anonymen Nachricht zu finden ist.
command_block_unblock_desc = Entblockt die Anon-ID, wenn dies auf True gesetzt ist.
command_block_help = {p:{cmd}} (anon-id) [unblock]
	Blockiere jede Anon-ID vom Senden anonymer Nachrichten. Blockierungen dauern bis zum nächsten Mischen der IDs.
	Entblocke, indem du unblock auf True setzt. Z.B. {p:block} anonid=abc123 unblock=true
command_shuffle = mischen
command_shuffle_desc = Mische alle Anon-IDs auf diesem Server, um die Anonymität zu schützen.
command_shuffle_help = {p:{cmd}}
	Setzt alle Anon-IDs zurück, um die Wahrscheinlichkeit zu verringern, dass ein Benutzer verfolgt und identifiziert wird.
command_sell = verkaufen
command_sell_desc = Liste einen Artikel auf, den du anonym verkaufen möchtest.
command_sell_title_desc = Beschreibe in wenigen Worten, was du verkaufas.
command_sell_starting_price_desc = Ein Zielpreis, den du wahrscheinlich akzeptieren würdest, inklusive Währung.
command_sell_payment_methods_desc = Liste die akzeptierten Zahlungsmethoden auf. Z.B. PayPal, Venmo, Krypto.
command_sell_description_desc = Beschreibe ausführlich, was du verkaufst. Verwende später /beichten, um mehr hinzuzufügen.
command_sell_image_desc = Ein Bild des Artikels, falls zutreffend.
command_sell_help = {p:{cmd}} (title) (starting_price) (payment_methods) [description] [image]
	Erstelle ein Angebot für einen Artikel, den du verkaufen möchtest. Angebote können nur in Marktplatz-Kanälen erstellt werden – verwende {p:list}, um einen zu finden.
	Angebote sind anonym, aber sobald du ein Preisangebot von einem Käufer akzeptierst, werden die Benutzernamen miteinander geteilt.
	Der Titel sollte kurz sein.
	Der Startpreis sollte in einer Währung angegeben sein, zum Beispiel US$, CAD, €, ¥.
	Zahlungsmethoden sollten jede Art von Transaktion sein, die du empfangen kannst, wie Banküberweisung, Kryptowährung oder eine Plattform wie PayPal.
