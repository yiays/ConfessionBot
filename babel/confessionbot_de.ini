setup_state = Der Kanal {channel} ist derzeit auf `{state}` eingestellt.
setup_state_missing = Fehler beim Abrufen dieses Kanals.
setup_channel_missing = Keine gültigen Kanäle gefunden!
	Damit ein Kanal in {p:setup} erscheint, muss es sich um einen regulären Textkanal handeln, der für den Bot sichtbar ist.
state_desc_-1 = > **Nicht eingerichtete Kanäle** akzeptieren keine Geständnisse. Andere Bot-Befehle können jedoch weiterhin verwendet werden.
state_desc_0 = > **Anonyme (Nicht nachverfolgbare) Kanäle** verbergen Anon-IDs für zusätzliche Anonymität. Wenn jedoch ein Überprüfungs-Kanal eingerichtet ist, werden Anon-IDs dort weiterhin angezeigt.
state_desc_1 = > **Anonyme (Anon-IDs) Kanäle** sind der Standard. Anon-IDs (zufällige Codes basierend auf deiner Benutzer-ID) erscheinen neben den Nachrichten. Diese können nicht rückgängig gemacht werden, um Benutzer zu finden, aber jeder Benutzer hat eine andere Farbe und ID.
state_desc_2 = > Der **Überprüfungs-Kanal** fängt Geständnisse ab, bevor sie öffentlich gepostet werden. Von dort aus können Moderatoren Geständnisse genehmigen oder ablehnen. Feedback wird nicht überprüft.
state_desc_3 = > **Feedback (Anon-IDs) Kanäle** stehen allen Benutzern deines Servers zur Verfügung, auch wenn sie den Kanal nicht sehen können. Benutzer müssen lediglich {p:confess-to} anstelle anderer Methoden verwenden.
state_desc_4 = > **Feedback (Nicht nachverfolgbare) Kanäle** können von allen Mitgliedern des Servers genutzt werden, ohne dass sie ihn sehen müssen, und teilen auch keine Anon-IDs. Benutzer müssen möglicherweise {p:confess-to} verwenden, um diesen Kanal zu nutzen.
state_desc_5 = > **Marktplatz-Kanäle** funktionieren wie anonyme Kanäle (mit Anon-IDs), aber die anonymen Nachrichten sind als Marktplatz-Angebote konzipiert. Benutzer können Angebote machen und sich auf einen Preis einigen, danach werden die Benutzernamen ausgetauscht.
state_cta = *Ändere dieses Verhalten, indem du unten einen neuen Kanaltyp auswählst.*
