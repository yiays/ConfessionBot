; report
report_prep = ## Melden von {msgurl}
	**Bitte lies die [{c:main/botname} Nutzungsbedingungen]({c:main/tos_url}), bevor du fortfährst!**
	Einige weitere Informationen, die du wissen solltest:
	- Meldungen werden direkt an die Bot-Entwickler gesendet. Wenn sie feststellen, dass diese Nachricht gegen die Regeln verstößt, können sie den Benutzer für diesen Bot sperren.
	- Wenn festgestellt wird, dass ein Server als Ganzes gegen die Nutzungsbedingungen dieses Bots verstößt, kann der gesamte Server von der Nutzung dieses Bots ausgeschlossen werden.
	- Wenn es sich um ein kleineres Vergehen handelt, solltest du mit den Moderatoren und Admins auf diesem Server sprechen.
	Wenn du glaubst, dass diese Nachricht gegen die {c:main/botname} Nutzungsbedingungen verstößt, drücke unten auf die Schaltfläche, um fortzufahren.
